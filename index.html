<!doctype html>
<html lang="en" data-default-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bill Audit: see where your Datadog money goes</title>
    <meta name="description" content="Attribute your Datadog bill by product and team, forecast the renewal, and generate the exclusion filters, tag allowlists and Vector config that cut it. Runs in your browser." />
    <meta name="theme-color" content="#632ca6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      ;(function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : document.documentElement.dataset.defaultMode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
